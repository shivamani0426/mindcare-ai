name: MindCare checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py patient_labels.py
      - run: python -m pytest -q
      - run: |
          node --check static/app.js
          node --check static/games.js
          node --check static/voice.js
          node --check static/calls.js
          node --check static/family-lightbox.js
          node --check static/patient-today.js
          node --check static/patient-help-calls.js
          node --check static/patient-notifications.js
          node --check static/game-i18n.js
