name: MindCare checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py patient_labels.py
      - run: python -m pytest -q
      - run: bash -n scripts/backup_postgres.sh && bash -n scripts/verify_postgres_backup.sh && bash -n scripts/rehearse_postgres_restore.sh && bash -n tests/backup_restore_smoke.sh
      - run: |
          node --check static/app.js
          node --check static/games.js
          node --check static/voice.js
          node --check static/calls.js
          node --check static/family-lightbox.js
          node --check static/patient-today.js
          node --check static/patient-help-calls.js
          node --check static/patient-notifications.js
          node --check static/game-i18n.js
          node --check static/caregiver-dashboard.js
          node --check static/auth-ui.js
          node --check static/milo.js
          node --check static/landing-world.js
          node --check static/landing-cinematic.js
          node --check static/mindcare-vortex.js
          node --check static/mindcare-vortex-arrival.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_caregiver_smoke.py

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: bash tests/backup_restore_smoke.sh

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium webkit
      - run: python tests/browser_mobile_smoke.py
