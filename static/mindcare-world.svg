<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">MindCare's gentle world of play, routine and connection</title><desc id="desc">An original dreamy night scene with floating memory cards, a bright path through soft hills, a family heart, and a cheerful green plant character called Milo.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a091b"/><stop offset=".3" stop-color="#152247"/><stop offset=".65" stop-color="#332350"/><stop offset="1" stop-color="#081a23"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#7b4ab8" stop-opacity=".85"/><stop offset=".5" stop-color="#413eaa" stop-opacity=".45"/><stop offset="1" stop-color="#151a30" stop-opacity="0"/></radialGradient>
<radialGradient id="sunshine"><stop stop-color="#ee9eac" stop-opacity=".75"/><stop offset=".43" stop-color="#b65fc2" stop-opacity=".35"/><stop offset="1" stop-color="#271038" stop-opacity="0"/></radialGradient>
<linearGradient id="hill" x1="0" x2=".4" y1="0" y2="1"><stop stop-color="#324f76"/><stop offset=".55" stop-color="#172b4e"/><stop offset="1" stop-color="#0b1325"/></linearGradient>
<linearGradient id="grass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#4ca486"/><stop offset=".5" stop-color="#326e76"/><stop offset="1" stop-color="#162c49"/></linearGradient>
<linearGradient id="path" x1=".2" x2=".7" y1="0" y2="1"><stop stop-color="#ffc9a8"/><stop offset=".42" stop-color="#f3a5c8"/><stop offset="1" stop-color="#967de0"/></linearGradient>
<linearGradient id="milo" x1=".2" x2="1" y1="0" y2="1"><stop stop-color="#d0ffe1"/><stop offset=".48" stop-color="#9be4ad"/><stop offset="1" stop-color="#4ebd8e"/></linearGradient>
<linearGradient id="cardPink" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f2adbb"/><stop offset="1" stop-color="#b96fc6"/></linearGradient>
<linearGradient id="cardBlue" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b5e6f7"/><stop offset="1" stop-color="#78a8e6"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
<filter id="shadow" x="-60%" width="220%" y="-60%" height="240%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="17"/><feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
